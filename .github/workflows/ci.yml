name: Server CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type-check Cloudflare Worker
        run: npm run worker:typecheck
      - name: Test
        run: npm test
      - name: Validate Worker deployment bundle
        run: npx wrangler deploy --dry-run
