name = "cookie-share-next-server"
main = "src/worker/index.ts"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]
# Preserve dashboard-managed text variables on Git-driven deployments.
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "cookie-share-next"
database_id = "9ef95bea-fe42-4cda-8205-9277582664fb"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]

[vars]
DEFAULT_QUOTA_BYTES = "104857600"
DEFAULT_DAILY_REQUEST_LIMIT = "1000"
SESSION_TTL_HOURS = "720"
LOGIN_RATE_LIMIT = "10"
LOGIN_RATE_WINDOW_MIN = "15"
REQUEST_LOG_RETENTION_DAYS = "7"
